name: Deploy to staging by FTP

on:
  push:
    branches:
      - staging
      
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install auth dependencies
        run: composer install --working-dir app/Auth --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Deploy to system-dev by FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.KIWEB_DEV_FTP_SERVER }}
          username: ${{ secrets.KIWEB_DEV_FTP_USERNAME }}
          password: ${{ secrets.KIWEB_DEV_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.KIWEB_DEV_FTP_PORT }}
          security : loose
          timeout : 120000
          local-dir: ./
          server-dir: ${{ secrets.KIWEB_DEV_FTP_SERVER_DIR }}
          dry-run: false
          log-level : standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/.env
            **/config/auth/user-sync.env
            **/config/room-booking/config.local.php
            **/config/room-booking/credentials/service-account.json
            **/apis/justdb_teacher_bridge.php
            **/gas/**/consts.gs
            **/storage/auth/runtime/**
            **/storage/auth/private-pdfs/**
            **/storage/room-booking/**
