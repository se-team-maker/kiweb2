# nginx configuration for /kiweb/
# このファイルを既存のnginx設定に追加してください
# 
# 設定方法:
# 1. このファイルの内容を /etc/nginx/sites-available/ 内の設定ファイルに追加
# 2. または /etc/nginx/conf.d/ に配置
# 3. sudo nginx -t でテスト
# 4. sudo systemctl reload nginx で反映

# /kiweb/ ルートへのアクセスをログインページにリダイレクト
location = /kiweb/ {
    return 302 /kiweb/login/public/login.php;
}

location = /kiweb {
    return 302 /kiweb/login/public/login.php;
}

# 旧URL互換リダイレクト。まずは 302。安定後に 301 へ変更する。
location ~ ^/kiweb/teacher-auth/public/(.*)$ {
    return 302 /kiweb/public/auth/$1$is_args$args;
}

location ~ ^/kiweb/teacher-auth/api/(.*)$ {
    return 302 /kiweb/public/auth/api/$1$is_args$args;
}

location = /kiweb/teacher-sync/api/teachers.php {
    return 302 /kiweb/public/user/api/teachers.php$is_args$args;
}

location = /kiweb/room-booking/room-booking.php {
    return 302 /kiweb/public/room-booking/index.php$is_args$args;
}

location = /kiweb/room-booking/room-booking-qr.png {
    return 302 /kiweb/public/room-booking/assets/room-booking-qr.png$is_args$args;
}

location ~ ^/kiweb/room-booking/api/(.*)$ {
    return 302 /kiweb/public/room-booking/api/$1$is_args$args;
}

location = /kiweb/ClassReportSearchForm.html {
    return 302 /kiweb/public/class-report/search.html$is_args$args;
}

location = /kiweb/check_in_out.html {
    return 302 /kiweb/public/check-in/index.html$is_args$args;
}

location = /kiweb/work-record.html {
    return 302 /kiweb/public/check-in/work-record.html$is_args$args;
}

location = /kiweb/class-declaration.html {
    return 302 /kiweb/public/class-report/declaration.html$is_args$args;
}

location = /kiweb/class-declaration-fulltime.html {
    return 302 /kiweb/public/class-report/declaration-fulltime.html$is_args$args;
}

location = /kiweb/class-reschedule.html {
    return 302 /kiweb/public/class-report/reschedule.html$is_args$args;
}

location = /kiweb/class-reschedule2.html {
    return 302 /kiweb/public/class-report/reschedule2.html$is_args$args;
}

location = /kiweb/class-reschedule-parttime.html {
    return 302 /kiweb/public/class-report/reschedule-parttime.html$is_args$args;
}

location = /kiweb/class-reschedule_fulltime.html {
    return 302 /kiweb/public/class-report/reschedule-fulltime.html$is_args$args;
}

location = /kiweb/declaration_of_non_class_work_search_and_view.html {
    return 302 /kiweb/public/class-report/non-class-work-search.html$is_args$args;
}

location = /kiweb/search_for_class_implementation_declaration.html {
    return 302 /kiweb/public/class-report/implementation-search.html$is_args$args;
}

location = /kiweb/room_allocation.html {
    return 302 /kiweb/public/room-booking/room-allocation.html$is_args$args;
}

location = /kiweb/teacher-no-view.html {
    return 302 /kiweb/public/user/teacher-no-view.html$is_args$args;
}

location = /kiweb/favicon.png {
    return 302 /kiweb/public/assets/favicon.png$is_args$args;
}

location = /kiweb/ダウンロード.png {
    return 302 /kiweb/public/assets/download.png$is_args$args;
}

# ポータルHTMLは直接配信せず、必ずガード経由にする
location = /kiweb/kiweb2.html {
    return 302 /kiweb/public/auth/portal-guard.php;
}

location = /kiweb/kiweb2-fulltime.html {
    return 302 /kiweb/public/auth/portal-guard.php;
}

location = /kiweb/kiweb2-admin.html {
    return 302 /kiweb/public/auth/portal-guard.php;
}

# room-booking を room-booking.php に固定
location = /kiweb/room-booking {
    return 302 /kiweb/public/room-booking/index.php;
}

location = /kiweb/room-booking/ {
    return 302 /kiweb/public/room-booking/index.php;
}

# 新構成 public/ 配下のPHPファイルを処理
location /kiweb/public/auth/ {
    index index.php index.html;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

location /kiweb/public/documents/ {
    index index.php index.html;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

location /kiweb/public/room-booking/ {
    index index.php index.html;
    try_files $uri $uri/ /kiweb/public/room-booking/index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

location /kiweb/public/user/api/ {
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

# login/public/ 内のPHPファイルを処理
location /kiweb/login/public/ {
    # デフォルトインデックスファイル
    index index.php index.html;

    # PHPファイルの処理
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;  # PHP-FPMソケット（環境に合わせて変更）
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

# login/api/ 内のPHPファイルを処理
location /kiweb/login/api/ {
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

# room-booking の設定
location /kiweb/room-booking/ {
    index room-booking.php;
    try_files $uri $uri/ /kiweb/public/room-booking/index.php;

    # PHPファイルの処理を追加
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# .env, .htaccess, src, vendor, database, storage フォルダへのアクセスを禁止
location ~ /kiweb/login/(\.env|\.htaccess|src|vendor|database) {
    deny all;
    return 403;
}

location ~ /kiweb/(app|config|storage)/ {
    deny all;
    return 403;
}
